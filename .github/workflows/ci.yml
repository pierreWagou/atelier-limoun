name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            cms/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Install cms dependencies
        run: npm ci
        working-directory: cms

      # All commands below come from the root package.json (the command registry)
      - name: Lint
        run: npm run lint

      - name: Typecheck site
        run: npm run check:site

      - name: Typecheck cms
        run: npm run check:cms

      - name: Unit tests
        run: npm run test

  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: jdx/mise-action@v2

      # Tools come from mise.toml (pinned versions); the lint command itself
      # comes from the root package.json (the command registry).
      # CI runners auto-trust the config (see `mise trust --help`); the pipx
      # backend falls back to preinstalled pipx when uv is absent.
      - name: Install Ansible tooling
        run: mise install pipx:ansible-lint

      - name: Ansible lint
        run: npm run lint:ansible

  e2e:
    name: Build & E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            cms/package-lock.json

      - name: Install CMS dependencies
        run: npm ci
        working-directory: cms
      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Start Strapi (SQLite, seeded)
        working-directory: cms
        env:
          APP_KEYS: ci-key-1,ci-key-2
          API_TOKEN_SALT: ci-salt-1
          ADMIN_JWT_SECRET: ci-admin-jwt
          TRANSFER_TOKEN_SALT: ci-salt-2
          JWT_SECRET: ci-jwt
        run: |
          npm run build
          npm start &
          npx --yes wait-on http://localhost:1337/api/projects -t 120000

      - name: Build site against Strapi
        run: npm run build
        working-directory: site
        env:
          STRAPI_URL: http://localhost:1337

      - name: Install Playwright Chromium
        run: npm exec --prefix site -- playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
