# Ansible — reproducible OVH VPS baseline for atelier-limoun.fr
#
# Agentless: ansible runs on your laptop (installed via mise, see mise.toml),
# the VPS only needs SSH + Python (Ubuntu 24.04 ships both).
#
#   mise install            # one-time: ansible + node + gitleaks + mprocs
#   npm run ops:check       # dry-run: shows what WOULD change, changes nothing
#   npm run ops:converge    # apply the baseline (keep a second SSH session open)
#
# Target host and users come from committed vars (group_vars/all/main.yml) —
# no per-contributor setup. Overrides for exceptional cases:
#   ATELIER_LIMOUN_VPS_HOST=<other-ip>   target a different address
# First converge only, while just the OVH image user exists, use the :first
# tasks (ops:check:first / ops:converge:first) which log in as ubuntu.
[defaults]
inventory = ./inventory.yml
roles_path = ./roles
host_key_checking = true
retry_files_enabled = false
callback_result_format = yaml
deprecation_warnings = false
