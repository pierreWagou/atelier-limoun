---
# VPS users + SSH keys. Keys are declarative: missing keys are added,
# keys removed from a user's list are revoked (exclusive=true).
# Users with an empty key list are created locked (no login possible).
- name: Fail on malformed SSH keys
  ansible.builtin.assert:
    that:
      - item.1 is match('^(ssh-ed25519|ecdsa-sha2-nistp[0-9]+|ssh-rsa) ')
    fail_msg: >-
      Malformed public key for user '{{ item.0.name }}'.
      Fix it in vps_users in ansible/group_vars/all/main.yml.
  loop: "{{ vps_users | subelements('keys', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Create VPS users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ 'sudo' if (item.sudo | default(false)) else omit }}"
    append: true
    shell: /bin/bash
    password: "!"
    state: present
  loop: "{{ vps_users }}"
  loop_control:
    label: "{{ item.name }}"

# Passwordless sudo for operators: accounts are key-only with locked passwords,
# so there is no password to type — without this, become (sudo) fails and no
# converge can succeed. Validated with visudo before install; non-sudo users
# get no file (explicit absence = no privilege).
- name: Grant passwordless sudo to operators
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/atelier-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  loop: "{{ vps_users }}"
  when: item.sudo | default(false)
  loop_control:
    label: "{{ item.name }}"

- name: Deploy user SSH keys (revokes keys not listed)
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    # Explicit path: the users are created by this same role, so they may not
    # exist yet when dry-running — the module needs the full path in that case.
    path: "/home/{{ item.0.name }}/.ssh/authorized_keys"
    key: "{{ item.1 }}"
    state: present
    exclusive: true
  loop: "{{ vps_users | subelements('keys', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}"

# Keyless users never hit the task above (empty loop), so revocation
# "back to zero keys" needs explicit handling: truncate their authorized_keys.
- name: Ensure .ssh exists for keyless users
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ vps_users }}"
  when: (item['keys'] | default([])) | length == 0
  loop_control:
    label: "{{ item.name }}"

- name: Lock keyless users (empty authorized_keys, login impossible)
  ansible.builtin.copy:
    dest: "/home/{{ item.name }}/.ssh/authorized_keys"
    content: ""
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ vps_users }}"
  when: (item['keys'] | default([])) | length == 0
  loop_control:
    label: "{{ item.name }}"
