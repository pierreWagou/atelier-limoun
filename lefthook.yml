pre-commit:
  jobs:
    - name: biome
      run: npx biome check --write --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,astro,json,jsonc,css,yml,yaml}"
    - name: gitleaks
      run: gitleaks protect --staged --redact
      # gitleaks is provisioned by mise (see mise.toml), not an npm dep
    - name: ansible-lint
      # whole ansible/ dir (cross-file rules need full context, like upstream's pass_filenames: false)
      run: npm run lint:ansible
      glob: "ansible/**/*.{yml,yaml}"

pre-push:
  jobs:
    - name: vitest
      run: npm run test
      # unit tests are fast (<1s); E2E stays in CI (needs built site + Strapi)
    - name: typecheck-site
      run: npm run check:site
    - name: typecheck-cms
      run: npm run check:cms
